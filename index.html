  <script>
    let activeShareUrl = '';
    let activeShareTitle = '';

    // Handle Link Redirection / Simulated Navigation
    function handleLinkClick(title, url) {
      showToast(`Opening ${title}...`);
      setTimeout(() => {
        window.open(url, '_blank');
      }, 500);
    }

    // Modal Control Logic
    function openShareModal(title, url) {
      activeShareTitle = title;
      activeShareUrl = url;

      document.getElementById('modal-title').innerText = `Share "${title}"`;
      document.getElementById('modal-url').innerText = url;

      const modal = document.getElementById('share-modal');
      const modalContent = document.getElementById('modal-content');

      modal.classList.remove('opacity-0', 'pointer-events-none');
      modalContent.classList.remove('translate-y-10');
    }

    function closeShareModal() {
      const modal = document.getElementById('share-modal');
      const modalContent = document.getElementById('modal-content');

      modal.classList.add('opacity-0', 'pointer-events-none');
      modalContent.classList.add('translate-y-10');
    }

    // Close modal on backdrop click
    document.getElementById('share-modal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('share-modal')) {
        closeShareModal();
      }
    });

    // Copy to clipboard helper function using standard document.execCommand fallback
    function copyModalUrl() {
      const tempInput = document.createElement('input');
      tempInput.value = activeShareUrl;
      document.body.appendChild(tempInput);
      tempInput.select();
      
      try {
        document.execCommand('copy');
        showToast('Link copied to clipboard!');
      } catch (err) {
        showToast('Failed to copy link');
      }
      
      document.body.removeChild(tempInput);
      closeShareModal();
    }

    // Native Web Share API trigger with fallback
    function triggerNativeShare() {
      if (navigator.share) {
        navigator.share({
          title: activeShareTitle,
          url: activeShareUrl
        }).catch(() => {});
      } else {
        copyModalUrl();
      }
      closeShareModal();
    }

    // Toast Notification System
    let toastTimeout;
    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');

      toastMsg.innerText = message;
      toast.classList.remove('-translate-y-20', 'opacity-0');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('-translate-y-20', 'opacity-0');
      }, 3000);
    }
  </script>
