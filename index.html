    /* Custom Smooth Scroll & Selection Styles */
    ::selection {

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient background gradient effect */
    .bg-gradient-canvas {
      background: radial-gradient(circle at 50% 0%, #1c2229 0%, #0d0f12 55%, #07080a 100%);
    }

    /* Animated Ambient Orbs for Glassmorphism Depth */
    .ambient-orb {
      position: fixed;
      border-radius: 9999px;
      filter: blur(90px);
      opacity: 0.32;
      pointer-events: none;
      z-index: 0;
      will-change: transform;
    }

    .orb-1 {
      width: 360px;
      height: 360px;
      top: -80px;
      left: 50%;
      transform: translateX(-60%);
      background: radial-gradient(circle, rgba(142, 197, 232, 0.55) 0%, rgba(34, 76, 107, 0) 70%);
      animation: driftOrbOne 14s ease-in-out infinite alternate;
    }

    .orb-2 {
      width: 420px;
      height: 420px;
      top: 38%;
      right: -120px;
      background: radial-gradient(circle, rgba(229, 220, 200, 0.28) 0%, rgba(20, 35, 46, 0) 70%);
      animation: driftOrbTwo 18s ease-in-out infinite alternate;
    }

    .orb-3 {
      width: 380px;
      height: 380px;
      bottom: -100px;
      left: -100px;
      background: radial-gradient(circle, rgba(93, 139, 168, 0.42) 0%, rgba(18, 18, 18, 0) 70%);
      animation: driftOrbThree 16s ease-in-out infinite alternate;
    }

    @keyframes driftOrbOne {
      0% { transform: translate(-60%, 0px) scale(1); }
      100% { transform: translate(-35%, 65px) scale(1.15); }
    }

    @keyframes driftOrbTwo {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(-70px, -55px) scale(1.12); }
    }

    @keyframes driftOrbThree {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(85px, -45px) scale(1.18); }
    }

    /* Frosted Glass Main Panel */
    .glass-panel {
      background: linear-gradient(
        180deg,
        rgba(28, 32, 37, 0.58) 0%,
        rgba(18, 20, 23, 0.68) 45%,
        rgba(14, 16, 19, 0.78) 100%
      );
      backdrop-filter: blur(26px) saturate(135%);
      -webkit-backdrop-filter: blur(26px) saturate(135%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    /* Subtle Noise Texture Overlay on Glass */
    .glass-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0.04;
      background-image: radial-gradient(rgba(255, 255, 255, 0.9) 0.75px, transparent 0.75px);
      background-size: 6px 6px;
    }

    /* Frosted Glass Link Cards with Sheen Motion */
    .link-card {
      position: relative;
      overflow: hidden;
      background: rgba(5, 6, 8, 0.68);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1),
                  background-color 0.28s ease,
                  border-color 0.28s ease,
                  box-shadow 0.28s ease;
    }

    .link-card::after {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 65%;
      height: 100%;
      background: linear-gradient(
        105deg,
        transparent 0%,
        rgba(255, 255, 255, 0.08) 50%,
        transparent 100%
      );
      transform: skewX(-20deg);
      transition: left 0.65s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .link-card:hover {
      transform: translateY(-2px) scale(1.018);
      background: rgba(20, 23, 28, 0.78);
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow:
        0 14px 32px rgba(0, 0, 0, 0.52),
        0 0 22px rgba(142, 197, 232, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    .link-card:hover::after {
      left: 140%;
    }

    .link-card:active {
      transform: scale(0.985);
    }

    /* Entrance & Avatar Breathing Animations */
    @keyframes fadeUpIn {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes avatarFloat {
      0%, 100% {

    .reveal-item {

    /* Respect reduced-motion user preferences */

        animation: none !important;
        opacity: 1 !important;
      }
    }

    /* Custom Toast Styling */
    #toast {
      transition: transform 0.3s ease, opacity 0.3s ease;

  </div>

  <script>
    // Change your profile logo here: paste an image URL or local filename (e.g., "my-logo.png" or "https://example.com/logo.jpg")
    const PROFILE_LOGO_URL = "logo.jpeg";

    // Optional: Enter any Google Font name here to change the bio text font (e.g., "Poppins", "Montserrat", "Cinzel")
    const PROFILE_BIO_FONT = "";

    let activeShareUrl = '';
    let activeShareTitle = '';

    // Apply custom profile logo (falls back to built-in SVG emblem if empty or broken)
    const logoImgEl = document.getElementById('profile-logo-img');
    const logoSvgEl = document.getElementById('profile-logo-svg');
    if (PROFILE_LOGO_URL.trim() !== "") {
      logoImgEl.src = PROFILE_LOGO_URL.trim();
      logoImgEl.classList.remove('hidden');
      logoSvgEl.classList.add('hidden');
    } else {
      logoImgEl.classList.add('hidden');
      logoSvgEl.classList.remove('hidden');
    }

    // Apply custom bio font if specified
    if (PROFILE_BIO_FONT.trim() !== "") {
      const fontName = PROFILE_BIO_FONT.trim();
      const fontLink = document.createElement('link');
      fontLink.rel = 'stylesheet';
      fontLink.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(fontName)}:wght@400;500;600;700&display=swap`;
      document.head.appendChild(fontLink);
      document.getElementById('profile-bio').style.fontFamily = `"${fontName}", sans-serif`;
    }

    // Handle Link Redirection
    function handleLinkClick(title, url) {
      showToast(`Opening ${title}...`);
      setTimeout(() => {
        window.open(url, '_blank', 'noopener,noreferrer');
      }, 400);
    }

    // Modal Control Logic
    function openShareModal(title, url) {
      activeShareTitle = title;
      activeShareUrl = url;

      document.getElementById('modal-title').innerText = `Share "${title}"`;
      document.getElementById('modal-url').innerText = url;

      const modal = document.getElementById('share-modal');
      const modalContent = document.getElementById('modal-content');

      modal.classList.remove('opacity-0', 'pointer-events-none');
      modalContent.classList.remove('translate-y-10');
    }

    function closeShareModal() {
      const modal = document.getElementById('share-modal');
      const modalContent = document.getElementById('modal-content');

      modal.classList.add('opacity-0', 'pointer-events-none');
      modalContent.classList.add('translate-y-10');
    }

    // Close modal on backdrop click or Escape key
    document.getElementById('share-modal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('share-modal')) {
        closeShareModal();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeShareModal();
    });

    // Copy to clipboard helper using document.execCommand fallback
    function copyModalUrl() {
      const tempInput = document.createElement('input');
      tempInput.value = activeShareUrl;
      document.body.appendChild(tempInput);
      tempInput.select();

      try {
        document.execCommand('copy');
        showToast('Link copied to clipboard!');
      } catch (err) {
        showToast('Failed to copy link');
      }

      document.body.removeChild(tempInput);
      closeShareModal();
    }

    // Native Web Share API trigger with fallback
    function triggerNativeShare() {
      if (navigator.share) {
        navigator.share({
          title: activeShareTitle,
          url: activeShareUrl
        }).catch(() => {});
      } else {
        copyModalUrl();
      }
      closeShareModal();
    }

    // Toast Notification System
    let toastTimeout;
    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');

      toastMsg.innerText = message;
      toast.classList.remove('-translate-y-20', 'opacity-0');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('-translate-y-20', 'opacity-0');
      }, 3000);
    }
  </script>
</body>
</html>
